services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_only
    ports:
      - '127.0.0.1:54324:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d analytics']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - analytics-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
volumes:
  analytics-data:
